<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="robots" content="noindex, nofollow">

	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Login - Bluebird Accounts</title>
	<link rel="stylesheet" href="../style.css">
	<link rel="shortcut icon" href="../../images/bluebird_2027.png" type="image/x-icon">
	<link rel="stylesheet"
		href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=account_circle,arrow_forward,fingerprint" />
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/brands.css"
		integrity="sha512-Ve5cyESWChtU1zL3EIMU0T1LddBbffKw+bZsuO6YpN65a0EvnQnyiXnU72Xt9CgWyW7hMafF3hSWcUf55rGa/Q=="
		crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
	<div class="wrapper">
		<div class="container">
			<svg viewBox="25 25 50 50" class="spinner" id="main-spinner">
				<circle r="20" cy="50" cx="50"></circle>
			</svg>
			<div class="container-content main-log-in" id="main-log-in-page" style="display: none;">

				<div class="login-signup-selector">
					<a class="selected" href="#">Log In</a>
					<a href="../signup/">Sign Up</a>
				</div>
				<form id="user-section">
					<h1 style="text-align: center;">
						<img class="header-logo" src="./../../images/bluebird_2027.png" alt="Bluebird Logo">
					</h1>
					<h1 class="main-header">Welcome Back!</h1>
					<div class="input-cont">
						<label id="loginLabel">Email</label>
						<input translate="no" id="loginInput" type="text" placeholder="Email" required>
					</div>

					<div class="input-cont">
						<label>
							Password
						</label>
						<input translate="no" type="password" id="passwordInput" placeholder="Password" required>
					</div>
					<div style="display: flex; justify-content: space-between; padding: 0 30px; margin-bottom: 70px;">
						<label for="keepMeLoggedIn" style="display: flex; align-items: center; gap: 6px;">
							<input translate="no" type="checkbox" id="keepMeLoggedIn">
							Keep Me Logged In
						</label>
						<a href="../reset-access/index.html">Forgot Password?</a>
					</div>
					<div class="btn-cont">
						<button class="submit-btn" type="submit" id="submit-btn">Log in</button>
						<a class="alt-btn" href="../otp/index.html">Sign In with One Time Login</a>
					</div>
				</form>
				<div class="bottom-links">No account? <a href="../signup/">Sign Up</a>
				</div>
			</div>
		</div>
		<div class="right-sect">

		</div>
	</div>

	<noscript>
		<div class="noscript-container">
			<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" height="8rem" width="8rem" fill="darkorange">
				<path
					d="M7.5,15q-0.63,0-1.06-0.44T6,13.5v-1H7.5v1H9V9h1.5v4.5q0,0.63-0.44,1.06T9,15H7.5ZM13,15q-0.42,0-0.71-0.29T12,14V13h1.5v0.5h2v-1H13q-0.42,0-0.71-0.29Q12,11.93 12,11.5V10q0-0.43 0.29-0.71T13,9h3q0.43,0 0.71,0.29T17,10v1H15.5V10.5h-2v1H16q0.43,0 0.71,0.29T17,12.5V14q0,0.42-0.29,0.71T16,15H13Z" />
			</svg>
			<h1>Looks like your Browser cannot run JavaScript</h1>
			<p>We need JavaScript to run. Without JavaScript enabled, you won't be able to login, create accounts, sign
				in using OTP, reset your account, or access your dashboard.</p>
			<h4>With that said:</h4>
			<b>We asked nicely. The website asked nicely. Now we're both asking: please enable JavaScript.</b>
		</div>
	</noscript>

	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
	<script src="../databaseInfo.js"></script>
	<script src="script.js"></script>
</body>

</html>
